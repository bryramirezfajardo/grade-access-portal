<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Access Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-700 p-2 rounded-lg font-bold shadow">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Student Grade Access Portal</h1>
                    <p class="text-xs text-blue-200">DepEd Class Record Breakdown View</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="navLogoutBtn" onclick="logout()" class="hidden bg-rose-600 hover:bg-rose-500 px-3 py-2 rounded-lg text-sm transition flex items-center space-x-1">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow">

        <!-- LOGIN & REGISTRATION VIEW -->
        <div id="authView" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
                <h2 id="authTitle" class="text-2xl font-bold">Mag-login sa Portal</h2>
                <p id="authSubtitle" class="text-blue-100 text-sm mt-1">Ilagay ang LRN para makita ang detalyadong marka</p>
            </div>

            <!-- Tabs for Login / Register -->
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button onclick="switchTab('login')" id="tabLoginBtn" class="flex-1 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition">Login</button>
                <button onclick="switchTab('register')" id="tabRegisterBtn" class="flex-1 py-3 text-sm font-semibold text-slate-500 hover:text-slate-700 transition">Magparehistro</button>
            </div>

            <div class="p-6">
                <!-- LOGIN FORM -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Learner Reference Number (LRN)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                            <input type="text" id="loginLrn" required placeholder="Hal. 123456789012" maxlength="12"
                                class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-700">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="loginPass" required placeholder="••••••••"
                                class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-700">
                        </div>
                    </div>
                    <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                        <span>Tingnan ang Detailed Scores</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <!-- REGISTRATION FORM -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4" style="display: none;">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Learner Reference Number (LRN)</label>
                        <input type="text" id="regLrn" required placeholder="12-Digit LRN" maxlength="12"
                            class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Buong Pangalan (Full Name)</label>
                        <input type="text" id="regName" required placeholder="Apelyido, Pangalan M.I."
                            class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Grade Level</label>
                            <select id="regGrade" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="Grade 9">Grade 9</option>
                                <option value="Grade 10">Grade 10</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Seksiyon</label>
                            <input type="text" id="regSection" required placeholder="Hal. Rizal"
                                class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pangalan ng Adviser</label>
                        <input type="text" id="regAdviser" required placeholder="Hal. Sir Bryan Fajardo"
                            class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" id="regPass" required placeholder="Gumawa ng password"
                            class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button type="submit" id="regBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
                        Magparehistro
                    </button>
                </form>

                <!-- Demo Mode Toggle -->
                <div class="mt-6 pt-4 border-t border-slate-100 text-center">
                    <button onclick="enableDemoMode()" class="text-xs text-blue-600 hover:underline font-medium">
                        <i class="fa-solid fa-flask"></i> Subukan ang Demo Mode (Class Record Sample Data)
                    </button>
                </div>
            </div>
        </div>

        <!-- DASHBOARD VIEW (CLASS RECORD BREAKDOWN) -->
        <div id="dashboardView" class="hidden space-y-6">
            <!-- Student Profile Card -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span id="studentGradeSec" class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Grade 9 - Peras</span>
                    <h2 id="studentNameDisplay" class="text-2xl font-bold text-slate-900 mt-1">Bagasan, Raidon Magnus Gamboa</h2>
                    <p class="text-sm text-slate-500">LRN: <span id="studentLrnDisplay" class="font-mono font-medium text-slate-700">123456789012</span></p>
                </div>
                <div class="bg-slate-50 px-4 py-3 rounded-xl border border-slate-200 text-right w-full md:w-auto">
                    <p class="text-xs text-slate-500">Adviser</p>
                    <p id="studentAdviserDisplay" class="font-semibold text-slate-800">Sir Bryan Fajardo</p>
                </div>
            </div>

            <!-- Quarter Selector Tabs -->
            <div class="flex space-x-2 overflow-x-auto pb-2">
                <button onclick="selectQuarter(1)" id="q1Btn" class="quarter-tab px-4 py-2.5 rounded-xl font-semibold text-sm bg-blue-600 text-white shadow-sm transition">1st Term / Quarter</button>
                <button onclick="selectQuarter(2)" id="q2Btn" class="quarter-tab px-4 py-2.5 rounded-xl font-semibold text-sm bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">2nd Term / Quarter</button>
                <button onclick="selectQuarter(3)" id="q3Btn" class="quarter-tab px-4 py-2.5 rounded-xl font-semibold text-sm bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">3rd Term / Quarter</button>
            </div>

            <!-- Detailed Breakdown Cards -->
            <div id="breakdownContainer" class="space-y-6">
                <!-- Dynamic Content Rendered Here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>Student Grade Access Portal &bull; DepEd Class Record Score Tracking</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaCrGVoRd2LT6Ytwu3o97YU2QgL4v7HbkZrYSR1MwbtFj0MDifqsLi8qZ3KoXcC4EtwQ/exec";
        let currentStudent = null;
        let activeQuarter = 1;

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');

            if(tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                authTitle.innerText = "Mag-login sa Portal";
                authSubtitle.innerText = "Ilagay ang LRN para makita ang detalyadong marka";
                tabLoginBtn.style.color = "#2563eb";
                tabLoginBtn.style.borderBottom = "2px solid #2563eb";
                tabRegisterBtn.style.color = "#64748b";
                tabRegisterBtn.style.borderBottom = "none";
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                authTitle.innerText = "Magrehistro sa Portal";
                authSubtitle.innerText = "Ilagay ang iyong mga detalye upang makapagrehistro";
                tabRegisterBtn.style.color = "#059669";
                tabRegisterBtn.style.borderBottom = "2px solid #059669";
                tabLoginBtn.style.color = "#64748b";
                tabLoginBtn.style.borderBottom = "none";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const lrn = document.getElementById('loginLrn').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'login', lrn: lrn, password: pass })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentStudent = data.student;
                    if (!currentStudent.grades) currentStudent.grades = { 1: null, 2: null, 3: null };
                    showDashboard();
                } else {
                    alert(data.message || "Maling LRN o Password.");
                }
            } catch (err) {
                alert("Error connecting to database: " + err.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const newStudent = {
                lrn: document.getElementById('regLrn').value.trim(),
                name: document.getElementById('regName').value.trim(),
                gradeLevel: document.getElementById('regGrade').value,
                section: document.getElementById('regSection').value.trim(),
                adviser: document.getElementById('regAdviser').value.trim(),
                password: document.getElementById('regPass').value.trim(),
                grades: {1: null, 2: null, 3: null}
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'register', student: newStudent })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Registration successful! Maaari ka nang mag-login.");
                    switchTab('login');
                    document.getElementById('loginLrn').value = newStudent.lrn;
                } else {
                    alert(data.message || "Registration failed.");
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        async function showDashboard() {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('navLogoutBtn').classList.remove('hidden');

            document.getElementById('studentNameDisplay').innerText = currentStudent.name;
            document.getElementById('studentLrnDisplay').innerText = currentStudent.lrn;
            document.getElementById('studentGradeSec').innerText = `${currentStudent.gradeLevel} - ${currentStudent.section}`;
            document.getElementById('studentAdviserDisplay').innerText = currentStudent.adviser;

            await fetchStudentGrades(currentStudent.lrn, activeQuarter);
        }

        async function fetchStudentGrades(lrn, term) {
            const container = document.getElementById('breakdownContainer');
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm p-12 text-center text-slate-400 border border-slate-100">
                    <i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-600"></i>
                    <p class="font-medium text-slate-600">Kina-karga ang mga marka mula sa database...</p>
                </div>`;

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'getGrades', lrn: lrn, term: term })
                });
                const data = await res.json();

                if (data.success && data.scoresData) {
                    if (!currentStudent.grades) currentStudent.grades = {};
                    currentStudent.grades[term] = parseRowToGrades(data.scoresData);
                } else {
                    if (!currentStudent.grades) currentStudent.grades = {};
                    currentStudent.grades[term] = null;
                }
            } catch (err) {
                console.log("Error fetching grades: ", err);
                if (!currentStudent.grades) currentStudent.grades = {};
                currentStudent.grades[term] = null;
            }

            renderBreakdown();
        }

        // Column mapping ayon sa aktuwal na class record (A hanggang AA).
        // Array index ay zero-based: A=0, B=1, C=2, ... AA=26.
        function parseRowToGrades(row) {
            if (!row || !Array.isArray(row) || row.length < 27) return null;

            const getNum = (idx) => {
                const v = row[idx];
                if (v === undefined || v === null || String(v).trim() === "") return 0;
                const n = Number(String(v).replace(/,/g, "").trim());
                return Number.isFinite(n) ? n : 0;
            };

            const getFormatted = (idx) => {
                const v = row[idx];
                if (v === undefined || v === null || String(v).trim() === "") return "0.00";
                const n = Number(String(v).replace(/,/g, "").trim());
                return Number.isFinite(n) ? n.toFixed(2) : "0.00";
            };

            return {
                subject: "Araling Panlipunan",
                ww: {
                    max: [20, 20, 25],
                    scores: [getNum(2), getNum(3), getNum(4)], // C, D, E
                    totalRaw: getNum(7),                       // H
                    totalMax: 65,
                    ps: getFormatted(8),                       // I
                    ws: getFormatted(9),                       // J
                    weightPct: 20
                },
                pt: {
                    max: [20, 10, 50],
                    scores: [getNum(10), getNum(11), getNum(12)], // K, L, M
                    totalRaw: getNum(13),                         // N
                    totalMax: 80,
                    ps: getFormatted(14),                         // O
                    ws: getFormatted(15),                         // P
                    weightPct: 50
                },
                st: {
                    st1: { score: getNum(16), max: 25 },       // Q
                    st2: { score: getNum(17), max: 25 },       // R
                    te:  { score: getNum(18), max: 50 },       // S
                    totalScoreSum: getNum(22),                 // W
                    ps: getFormatted(23),                      // X
                    ws: getFormatted(24),                      // Y
                    weightPct: 30
                },
                initialGrade: getFormatted(25),                // Z
                termGrade: getNum(26)                          // AA
            };
        }

        function logout() {
            currentStudent = null;
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
            document.getElementById('navLogoutBtn').classList.add('hidden');
        }

        async function selectQuarter(q) {
            activeQuarter = q;
            document.querySelectorAll('.quarter-tab').forEach((btn, idx) => {
                if (idx + 1 === q) {
                    btn.className = "quarter-tab px-4 py-2.5 rounded-xl font-semibold text-sm bg-blue-600 text-white shadow-sm transition";
                } else {
                    btn.className = "quarter-tab px-4 py-2.5 rounded-xl font-semibold text-sm bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition";
                }
            });
            await fetchStudentGrades(currentStudent.lrn, activeQuarter);
        }

        function renderBreakdown() {
            const container = document.getElementById('breakdownContainer');
            container.innerHTML = '';

            const termData = (currentStudent && currentStudent.grades && currentStudent.grades[activeQuarter]) ? currentStudent.grades[activeQuarter] : null;

            if (!termData || !termData.ww || !termData.pt || !termData.st) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center text-slate-400 border border-slate-100">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="font-medium text-slate-600">Wala pang nakatalang marka para sa Term/Quarter na ito.</p>
                        <p class="text-xs text-slate-400 mt-1">Lalabas dito ang iyong bawat Written Work, Performance Task, at Exam kapag na-encode na ng guro.</p>
                    </div>`;
                return;
            }

            const ww = termData.ww;
            const pt = termData.pt;
            const st = termData.st;
            const termGrade = termData.termGrade;

            let wwHtml = '';
            ww.scores.forEach((sc, i) => {
                const max = ww.max[i] || 0;
                wwHtml += `
                    <div class="flex justify-between items-center py-2 border-b border-slate-100 text-sm">
                        <span class="text-slate-600 font-medium">Written Work #${i+1}</span>
                        <span class="text-slate-800 font-semibold">${sc !== null ? sc : 0} / ${max}</span>
                    </div>`;
            });

            let ptHtml = '';
            pt.scores.forEach((sc, i) => {
                const max = pt.max[i] || 0;
                ptHtml += `
                    <div class="flex justify-between items-center py-2 border-b border-slate-100 text-sm">
                        <span class="text-slate-600 font-medium">Performance Task #${i+1}</span>
                        <span class="text-slate-800 font-semibold">${sc !== null ? sc : 0} / ${max}</span>
                    </div>`;
            });

            container.innerHTML = `
                <div class="bg-gradient-to-r from-blue-900 to-indigo-800 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                    <div>
                        <span class="bg-blue-700/60 text-blue-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">${termData.subject || 'Araling Panlipunan'}</span>
                        <h3 class="text-xl font-bold mt-2">Kasalukuyang Summary ng Marka</h3>
                        <p class="text-xs text-blue-200 mt-1">Computed Initial Grade: <span class="font-mono font-bold text-white">${termData.initialGrade}</span></p>
                    </div>
                    <div class="bg-white/10 backdrop-blur border border-white/20 rounded-2xl px-8 py-4 text-center">
                        <p class="text-xs uppercase tracking-wider text-blue-200 font-medium">Transmuted Term Grade</p>
                        <p class="text-4xl font-extrabold mt-1 ${termGrade >= 75 ? 'text-emerald-300' : 'text-rose-300'}">${termGrade}</p>
                        <span class="text-xs font-semibold ${termGrade >= 75 ? 'text-emerald-200' : 'text-rose-200'}">${termGrade >= 75 ? 'PASSED' : 'AT-RISK / FAILED'}</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Written Work -->
                    <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center pb-3 border-b border-slate-200">
                                <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <i class="fa-solid fa-pen-to-square text-blue-600"></i> Written Work (20%)
                                </h4>
                                <span class="text-xs font-bold bg-blue-50 text-blue-700 px-2 py-1 rounded">WS: ${ww.ws}%</span>
                            </div>
                            <div class="mt-3 space-y-1">${wwHtml}</div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between"><span class="text-slate-500">Total Raw Score:</span> <span class="font-bold text-slate-800">${ww.totalRaw} / ${ww.totalMax}</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">Percentage Score (PS):</span> <span class="font-bold text-slate-800">${ww.ps}%</span></div>
                        </div>
                    </div>

                    <!-- Performance Task -->
                    <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center pb-3 border-b border-slate-200">
                                <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <i class="fa-solid fa-list-check text-emerald-600"></i> Performance Task (50%)
                                </h4>
                                <span class="text-xs font-bold bg-emerald-50 text-emerald-700 px-2 py-1 rounded">WS: ${pt.ws}%</span>
                            </div>
                            <div class="mt-3 space-y-1">${ptHtml}</div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between"><span class="text-slate-500">Total Raw Score:</span> <span class="font-bold text-slate-800">${pt.totalRaw} / ${pt.totalMax}</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">Percentage Score (PS):</span> <span class="font-bold text-slate-800">${pt.ps}%</span></div>
                        </div>
                    </div>

                    <!-- Tests & Exams -->
                    <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center pb-3 border-b border-slate-200">
                                <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <i class="fa-solid fa-file-signature text-amber-600"></i> Tests & Exams (30%)
                                </h4>
                                <span class="text-xs font-bold bg-amber-50 text-amber-700 px-2 py-1 rounded">WS: ${st.ws}%</span>
                            </div>
                            <div class="mt-3 space-y-2 text-sm">
                                <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                                    <span class="text-slate-600 font-medium">ST1 (30%)</span>
                                    <span class="font-semibold text-slate-800">${st.st1.score !== null ? `${st.st1.score} / ${st.st1.max}` : '0 / 25'}</span>
                                </div>
                                <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                                    <span class="text-slate-600 font-medium">ST2 (30%)</span>
                                    <span class="font-semibold text-slate-800">${st.st2.score !== null ? `${st.st2.score} / ${st.st2.max}` : '0 / 25'}</span>
                                </div>
                                <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                                    <span class="text-slate-600 font-medium">Term Exam (40%)</span>
                                    <span class="font-semibold text-slate-800">${st.te.score !== null ? `${st.te.score} / ${st.te.max}` : '0 / 50'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between"><span class="text-slate-500">Total Score Sum:</span> <span class="font-bold text-slate-800">${st.totalScoreSum} / 100</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">Percentage Score (PS):</span> <span class="font-bold text-slate-800">${st.ps}%</span></div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
